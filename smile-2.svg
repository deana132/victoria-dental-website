<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-label="A happy patient with a bright, healthy smile">
  <defs><radialGradient id="bgbobe6a" cx="50%" cy="40%" r="72%">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3f3fa"/></radialGradient></defs>
  <rect width="420" height="420" rx="20" fill="url(#bgbobe6a)"/>

  <!-- neck + shoulders -->
  <path d="M170 336 h80 v-40 a40 40 0 0 1 -80 0 Z" fill="#d3a276"/>
  <path d="M104 420 Q104 350 210 344 Q316 350 316 420 Z" fill="#dfe9f2"/>

  <!-- ears -->
  <circle cx="98" cy="222" r="20" fill="#e3b892"/><circle cx="322" cy="222" r="20" fill="#e3b892"/>
  <!-- head -->
  <ellipse cx="210" cy="214" rx="120" ry="134" fill="#e3b892"/>
  <path d="M88 262 Q74 108 210 94 Q346 108 332 262 Q326 196 318 172 Q300 128 210 124 Q120 128 102 172 Q94 196 88 262 Z" fill="#2f2a33"/>

  <!-- cheeks -->
  <ellipse cx="150" cy="242" rx="24" ry="15" fill="#e6a58f" opacity="0.55"/>
  <ellipse cx="270" cy="242" rx="24" ry="15" fill="#e6a58f" opacity="0.55"/>

  <!-- brows -->
